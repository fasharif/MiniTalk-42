name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Build with warnings as errors
        run: make CC=${{ matrix.compiler }} all bonus

      - name: End-to-end tests
        run: sh tests/run_e2e.sh
